/* ===== Palestra: Fascicolo, Scale, Sensore, Quaderno, avvio ===== */

/* ---------- Fascicolo: componente condiviso tra la vista e il blocco di una seduta ---------- */
var NOMI_COLONNE = { 1: "Posso provarlo", 2: "Lo spiego, non lo provo", 3: "Non lo so ancora" };
var NOMI_BREVI = { 1: "Provo", 2: "Spiego", 3: "Non so" };
var TIPI_PROVA = { misura: "Una misura", ripasso_distanza: "Un ripasso a distanza superato", artefatto: "Un mio artefatto" };

/* opzioni: {voci: [{chiave, ...doc}], seduta: bool, cartuccia, onCambio(), copia: bool}
   Ogni voce ha colonna 1|2|3 oppure null (da sistemare). */
function compFascicolo(opz) {
  var voci = opz.voci;
  var aperti = {};   // chiave -> true se il modulo della prova è aperto
  var radice = el("div", { class: "stack" });
  var testoCopia = null;

  function scrivi(v) {
    var doc = { testo: v.testo, colonna: v.colonna, prova: v.prova || null, origine: v.origine, creata: v.creata, aggiornata: v.aggiornata, segnata: !!v.segnata, storia: v.storia };
    return Archivio.scrivi("fascicolo", v.chiave, doc);
  }
  async function sposta(v, col, prova) {
    var oggi = dataLocale(adesso());
    v.colonna = col;
    v.prova = col === 1 ? prova : null;
    v.aggiornata = adesso().toISOString();
    if (!v.creata) v.creata = v.aggiornata;
    v.storia = (v.storia || []).concat([{ data: oggi, colonna: col }]);
    delete aperti[v.chiave];
    await scrivi(v);
    disegna();
    if (opz.onCambio) opz.onCambio();
  }
  function nodoVoce(v) {
    var k = v.chiave;
    var nodo = el("div", { class: "voce", testid: "voce-" + k, data: { segnata: v.segnata ? "si" : "no" } }, [
      par(v.testo),
      el("div", { class: "muted" }, "Origine: " + (v.origine === "mia" ? "mia" : v.origine) + (v.aggiornata ? " · aggiornata il " + dataDaIso(v.aggiornata) : "")),
      v.prova ? el("div", { class: "muted testo-lungo" }, "Prova (" + (TIPI_PROVA[v.prova.tipo] || v.prova.tipo) + "): " + v.prova.testo) : null,
      el("div", { class: "sposta" }, [1, 2, 3].map(function (n) {
        return btn(NOMI_BREVI[n], { class: "btn piccolo", testid: "sposta-" + k + "-" + n, "aria-label": "Sposta in «" + NOMI_COLONNE[n] + "»", "aria-pressed": v.colonna === n ? "true" : "false" }, function () {
          if (n === 1) { aperti[k] = true; disegna(); return; }
          sposta(v, n, null);
        });
      }))
    ]);
    if (aperti[k]) {
      var tipo = el("select", { class: "campo", id: "prova-tipo-" + k, testid: "prova-tipo-" + k, "aria-label": "Tipo di prova" },
        Object.keys(TIPI_PROVA).map(function (t) { return el("option", { value: t, text: TIPI_PROVA[t] }); }));
      var testo = el("textarea", { class: "campo", id: "prova-testo-" + k, testid: "prova-testo-" + k, rows: "3", "aria-label": "La prova" });
      var errore = null;
      var conferma = btn("Conferma la prova", { class: "btn primario piccolo", testid: "prova-conferma-" + k }, function () {
        var t = testo.value.trim();
        if (!t) {
          if (!errore) {
            errore = el("p", { class: "err", testid: "errore-prova-" + k, role: "alert", text: "Serve una prova: una misura, un ripasso a distanza superato o un tuo artefatto" });
            conferma.before(errore);
          }
          return;
        }
        sposta(v, 1, { tipo: tipo.value, testo: t });
      });
      nodo.appendChild(el("div", { class: "stack" }, [
        par("Una stima, anche tua, sta in «Lo spiego, non lo provo».", "muted"),
        el("label", { class: "lab", for: "prova-tipo-" + k }, ["Che prova hai?", tipo]),
        el("label", { class: "lab", for: "prova-testo-" + k }, ["Descrivila", testo]),
        conferma
      ]));
    }
    if (!opz.seduta) {
      nodo.appendChild(btn(v.segnata ? "Tolta da «Da rivedere»" : "Da rivedere", { class: "btn piccolo", testid: "btn-segna-" + k, "aria-pressed": v.segnata ? "true" : "false" }, async function () {
        v.segnata = !v.segnata;
        v.aggiornata = adesso().toISOString();
        await scrivi(v);
        disegna();
      }));
    }
    return nodo;
  }
  function colonna(n) {
    var dentro = voci.filter(function (v) { return v.colonna === n; }).sort(function (a, b) { return (b.aggiornata || "") < (a.aggiornata || "") ? -1 : 1; });
    return el("section", { class: "colonna", testid: "fascicolo-col-" + n }, [
      el("h3", { text: NOMI_COLONNE[n] }),
      dentro.length ? dentro.map(nodoVoce) : par("Vuota", "muted")
    ]);
  }
  function disegna() {
    radice.replaceChildren();
    var senza = voci.filter(function (v) { return v.colonna !== 1 && v.colonna !== 2 && v.colonna !== 3; });
    if (opz.seduta && senza.length) {
      radice.appendChild(el("section", { class: "colonna", testid: "fascicolo-da-sistemare" }, [el("h3", { text: "Da sistemare" })].concat(senza.map(nodoVoce))));
    }
    radice.appendChild(colonna(1));
    radice.appendChild(colonna(2));
    radice.appendChild(colonna(3));
    if (opz.copia) {
      var copia = btn("Copia le voci che posso provare", { class: "btn", testid: "btn-copia-fascicolo" }, function () {
        var righe = voci.filter(function (v) { return v.colonna === 1; }).map(function (v) {
          return "• " + v.testo + (v.prova ? " — prova (" + (TIPI_PROVA[v.prova.tipo] || v.prova.tipo) + "): " + v.prova.testo : "");
        });
        var testo = righe.length ? righe.join("\n") : "Nessuna voce in «Posso provarlo».";
        if (!testoCopia) {
          testoCopia = el("textarea", { class: "campo", id: "testo-fascicolo", testid: "testo-fascicolo", rows: "8", readonly: true, "aria-label": "Voci da copiare" });
        }
        testoCopia.value = testo;
        copia.after(testoCopia);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(testo).then(function () {}, function () { testoCopia.select(); });
          else testoCopia.select();
        } catch (e) { testoCopia.select(); }
      });
      radice.appendChild(copia);
      if (testoCopia && testoCopia.value) copia.after(testoCopia);
    }
  }
  disegna();
  return { nodo: radice, voci: voci, ridisegna: disegna };
}

function vociDaDocumenti(docs) {
  return docs.map(function (d) {
    return { chiave: d.id, testo: d.testo, colonna: d.colonna, prova: d.prova || null, origine: d.origine, creata: d.creata, aggiornata: d.aggiornata, segnata: !!d.segnata, storia: d.storia || [] };
  });
}

RENDER.fascicolo = function (ctx, corpo) {
  var b = ctx.b, s = ctx.s;
  var box = el("div", { class: "stack" }, par("Carico le voci…", "muted"));
  corpo.appendChild(box);
  var comp = null;
  function aggiorna() {
    var risposta = {};
    var tutte = true;
    comp.voci.forEach(function (v) {
      var id = v.chiave.slice(ctx.c.id.length + 2);
      if (v.colonna === 1 || v.colonna === 2 || v.colonna === 3) risposta[id] = v.colonna; else tutte = false;
    });
    ctx.rec.risposta = risposta;
    ctx.setCompleto(tutte);
    if (tutte) ctx.commit();
  }
  Archivio.leggiTutti("fascicolo").then(function (docs) {
    if (S !== s || !box.isConnected) return;
    var esistenti = {};
    docs.forEach(function (d) { esistenti[d.id] = d; });
    var oggi = adesso().toISOString();
    var voci = b.voci.map(function (v) {
      var k = ctx.c.id + "__" + v.id;
      if (esistenti[k]) return vociDaDocumenti([esistenti[k]])[0];
      return { chiave: k, testo: v.testo, colonna: null, prova: null, origine: ctx.c.id, creata: oggi, aggiornata: oggi, segnata: false, storia: [] };
    });
    comp = compFascicolo({ voci: voci, seduta: true, cartuccia: ctx.c.id, onCambio: aggiorna });
    box.replaceChildren(comp.nodo);
    aggiorna();
  }, function () {
    box.replaceChildren(par("Non riesco a leggere il fascicolo dall'archivio.", "err"));
  });
};

async function mostraFascicolo() {
  var tk = nuovaVista("fascicolo");
  var box = el("div", { class: "stack" }, par("Carico il fascicolo…", "muted"));
  var nuovaTesto = el("input", { class: "campo", id: "fascicolo-nuova-testo", testid: "fascicolo-nuova-testo", type: "text", placeholder: "Una cosa che so fare o spiegare, con parole mie", "aria-label": "Nuova voce" });
  var comp = null;
  var aggiungiVoce = btn("Aggiungi (parte in «Non lo so ancora»)", { class: "btn", testid: "fascicolo-nuova-aggiungi" }, async function () {
    var t = nuovaTesto.value.trim();
    if (!t || !comp) return;
    var quando = adesso();
    var chiave = "mia-" + stampa(quando), n = 1;
    while (comp.voci.some(function (v) { return v.chiave === chiave; })) { n++; chiave = "mia-" + stampa(quando) + "-" + n; }
    var iso = quando.toISOString();
    var v = { chiave: chiave, testo: t, colonna: 3, prova: null, origine: "mia", creata: iso, aggiornata: iso, segnata: false, storia: [{ data: dataLocale(quando), colonna: 3 }] };
    await Archivio.scrivi("fascicolo", chiave, { testo: v.testo, colonna: 3, prova: null, origine: "mia", creata: iso, aggiornata: iso, segnata: false, storia: v.storia });
    if (tk !== stato.token) return;
    comp.voci.push(v);
    nuovaTesto.value = "";
    comp.ridisegna();
  });
  mostra([
    el("h1", { text: "Fascicolo" }),
    par("Tre colonne. «Posso provarlo» vuole una prova: una misura, un ripasso a distanza superato o un tuo artefatto.", "muted"),
    el("div", { class: "card" }, [el("label", { class: "lab", for: "fascicolo-nuova-testo" }, "Nuova voce"), nuovaTesto, aggiungiVoce]),
    box
  ]);
  try {
    var docs = await Archivio.leggiTutti("fascicolo");
    if (tk !== stato.token) return;
    comp = compFascicolo({ voci: vociDaDocumenti(docs), seduta: false, copia: true });
    box.replaceChildren(comp.nodo);
  } catch (e) {
    if (tk !== stato.token) return;
    box.replaceChildren(par("Non riesco a leggere il fascicolo dall'archivio.", "err"));
  }
}
VISTE.fascicolo = mostraFascicolo;

/* ---------- Scale: il ripasso quotidiano ---------- */
var INTERVALLI = [1, 3, 7, 14];

async function mostraScale() {
  var tk = nuovaVista("scale");
  var box = el("div", { class: "stack" }, par("Carico le carte…", "muted"));
  mostra([el("h1", { text: "Scale" }), box]);
  var docs;
  try { docs = await Archivio.leggiTutti("ripassi"); } catch (e) {
    if (tk !== stato.token) return;
    box.replaceChildren(par("Non riesco a leggere i ripassi dall'archivio.", "err")); return;
  }
  if (tk !== stato.token) return;
  var oggi = dataLocale(adesso());
  var dovute = docs.filter(function (d) { return d.prossima && d.prossima <= oggi; })
    .sort(function (a, b) { return a.prossima < b.prossima ? -1 : a.prossima > b.prossima ? 1 : (a.id < b.id ? -1 : 1); });
  if (inRipresa()) dovute = dovute.slice(0, 5);
  var n = dovute.length, k = 0;
  function disegna() {
    box.replaceChildren();
    if (k >= n) { box.appendChild(el("p", { testid: "scala-vuota", text: "Niente in scadenza oggi" })); return; }
    var d = dovute[k], girata = false;
    box.appendChild(el("span", { class: "dati muted", testid: "scala-progresso", text: (k + 1) + " / " + n }));
    box.appendChild(el("div", { class: "carta testo-lungo", testid: "scala-fronte", text: d.fronte }));
    var gira = btn("Gira la carta", { class: "btn primario", testid: "scala-gira" }, function () {
      if (girata) return;
      girata = true; gira.remove();
      box.appendChild(el("div", { class: "carta testo-lungo", testid: "scala-retro", text: d.retro }));
      box.appendChild(el("div", { class: "fid", style: "grid-template-columns:repeat(3,minmax(0,1fr))" }, [
        btn("Sì", { class: "btn", testid: "scala-si" }, function () { vota("si"); }),
        btn("Quasi", { class: "btn", testid: "scala-quasi" }, function () { vota("quasi"); }),
        btn("No", { class: "btn", testid: "scala-no" }, function () { vota("no"); })
      ]));
    });
    box.appendChild(gira);
    async function vota(voto) {
      var oggi2 = dataLocale(adesso());
      var passo = d.passo || 0;
      var nuovoPasso = passo, prossima;
      if (voto === "si") { nuovoPasso = Math.min(passo + 1, 3); prossima = piuGiorni(oggi2, INTERVALLI[nuovoPasso]); }
      else if (voto === "quasi") { prossima = piuGiorni(oggi2, 1); }
      else { nuovoPasso = 0; prossima = piuGiorni(oggi2, 1); }
      var corpoDoc = { cartuccia: d.cartuccia, blocco: d.blocco, carta: d.carta, fronte: d.fronte, retro: d.retro, passo: nuovoPasso, prossima: prossima, storia: (d.storia || []).concat([{ data: oggi2, voto: voto }]) };
      await Archivio.scrivi("ripassi", d.id, corpoDoc);
      if (tk !== stato.token) return;
      k++;
      disegna();
    }
  }
  disegna();
}
VISTE.scale = mostraScale;

/* ---------- Sensore: fiducia contro esito ---------- */
async function mostraSensore() {
  var tk = nuovaVista("sensore");
  var box = el("div", { class: "stack" }, par("Carico i risultati…", "muted"));
  mostra([el("h1", { text: "Sensore" }), par("Quanto la tua fiducia corrisponde all'esito, solo per le sedute al banco.", "muted"), box]);
  var sedute;
  try { sedute = await Archivio.leggiTutti("sedute"); } catch (e) {
    if (tk !== stato.token) return;
    box.replaceChildren(par("Non riesco a leggere le sedute dall'archivio.", "err")); return;
  }
  if (tk !== stato.token) return;
  var tent = [];
  sedute.filter(function (s) { return s.zona === "banco" && s.blocchi; }).forEach(function (s) {
    Object.keys(s.blocchi).forEach(function (bid) {
      var x = s.blocchi[bid];
      if (x && x.fiducia && (x.esito === "giusto" || x.esito === "sbagliato")) tent.push({ quando: x.quando || s.inizio, titolo: s.titolo, blocco: bid, fiducia: x.fiducia, esito: x.esito });
    });
  });
  if (!tent.length) { box.replaceChildren(el("p", { testid: "sensore-vuoto", text: "Ancora nessun dato: gioca una cartuccia al banco." })); return; }
  var tabella = el("div", { class: "tab-sensore", testid: "sensore-tabella" });
  for (var f = 5; f >= 1; f--) {
    var del = tent.filter(function (t) { return t.fiducia === f; });
    var giusti = del.filter(function (t) { return t.esito === "giusto"; }).length;
    var testo = del.length
      ? "Fiducia " + f + " — " + del.length + (del.length === 1 ? " tentativo, " : " tentativi, ") + giusti + (giusti === 1 ? " giusto (" : " giusti (") + Math.round(giusti / del.length * 100) + "%)"
      : "Fiducia " + f + " — nessun tentativo";
    tabella.appendChild(el("div", { class: "riga-sensore", testid: "sensore-riga-" + f, text: testo, data: { tentativi: del.length, giusti: giusti } }));
  }
  var eccesso = tent.filter(function (t) { return t.fiducia >= 4 && t.esito === "sbagliato"; }).length;
  var difetto = tent.filter(function (t) { return t.fiducia <= 2 && t.esito === "giusto"; }).length;
  var storia = tent.slice().sort(function (a, b) { return a.quando < b.quando ? 1 : a.quando > b.quando ? -1 : 0; }).slice(0, 20);
  box.replaceChildren(
    tabella,
    el("p", { testid: "sensore-eccesso", data: { valore: eccesso }, text: "Sicuro e sbagliato (fiducia 4 o 5): " + eccesso }),
    el("p", { testid: "sensore-difetto", data: { valore: difetto }, text: "Ti sei sottovalutato (fiducia 1 o 2, esito giusto): " + difetto }),
    el("section", { class: "stack", testid: "sensore-storia" }, [
      el("h3", { text: "Ultimi tentativi" }),
      el("ul", { class: "pulita" }, storia.map(function (t) {
        return el("li", { class: "riga-sensore testo-lungo", text: dataDaIso(t.quando) + " · " + t.titolo + " · " + t.blocco + " · fiducia " + t.fiducia + " · " + (t.esito === "giusto" ? "giusto" : "non ancora") });
      }))
    ])
  );
}
VISTE.sensore = mostraSensore;

/* ---------- Quaderno ---------- */
async function mostraQuaderno() {
  var tk = nuovaVista("quaderno");
  var voci = [];
  var elenco = el("div", { class: "stack" });
  var filtro = el("select", { class: "campo", id: "quaderno-filtro", testid: "quaderno-filtro", "aria-label": "Filtra per materia" });
  var materie = el("datalist", { id: "elenco-materie" });
  var tipo = el("select", { class: "campo", id: "quaderno-tipo", testid: "quaderno-tipo", "aria-label": "Tipo" }, [el("option", { value: "nota", text: "Nota" }), el("option", { value: "parola", text: "Parola mia" })]);
  var materia = el("input", { class: "campo", id: "quaderno-materia", testid: "quaderno-materia", type: "text", list: "elenco-materie", autocomplete: "off" });
  var testo = el("textarea", { class: "campo", id: "quaderno-testo", testid: "quaderno-testo", rows: "3" });
  var termine = el("input", { class: "campo", id: "quaderno-termine", testid: "quaderno-termine", type: "text", autocomplete: "off" });
  var boxTermine = el("label", { class: "lab", for: "quaderno-termine", hidden: true }, ["Termine tecnico", termine]);
  var etTesto = el("label", { class: "lab", for: "quaderno-testo" }, "Nota");
  var errore = el("p", { class: "err", role: "alert" });
  function sync() {
    var parola = tipo.value === "parola";
    boxTermine.hidden = !parola;
    etTesto.firstChild.textContent = parola ? "La parola tua" : "Nota";
  }
  tipo.addEventListener("change", sync);
  etTesto.appendChild(testo);
  function disegna() {
    var m = {};
    voci.forEach(function (v) { if (v.materia) m[v.materia] = true; });
    var lista = Object.keys(m).sort();
    var corrente = filtro.value;
    filtro.replaceChildren(el("option", { value: "", text: "Tutte le materie" }), lista.map(function (x) { return el("option", { value: x, text: x }); }));
    filtro.value = lista.indexOf(corrente) >= 0 ? corrente : "";
    materie.replaceChildren(lista.map(function (x) { return el("option", { value: x }); }));
    elenco.replaceChildren();
    var visibili = voci.filter(function (v) { return !filtro.value || v.materia === filtro.value; })
      .sort(function (a, b) { return a.creata < b.creata ? 1 : a.creata > b.creata ? -1 : (a.id < b.id ? 1 : -1); });
    if (!visibili.length) elenco.appendChild(par("Ancora niente qui.", "muted"));
    visibili.forEach(function (v) {
      elenco.appendChild(el("div", { class: "card", testid: "quaderno-voce-" + v.id }, [
        el("div", { class: "riga" }, [el("span", { class: "tag", text: v.tipo === "parola" ? "Parola" : "Nota" }), v.materia ? el("span", { class: "muted", text: v.materia }) : null, el("span", { class: "muted dati", text: dataDaIso(v.creata) })]),
        v.tipo === "parola" ? par(v.testo + " → " + v.termine_tecnico) : par(v.testo)
      ]));
    });
  }
  filtro.addEventListener("change", disegna);
  var salva = btn("Salva", { class: "btn primario", testid: "quaderno-salva" }, async function () {
    var t = testo.value.trim(), parola = tipo.value === "parola", term = termine.value.trim();
    errore.textContent = "";
    if (!t) { errore.textContent = parola ? "Scrivi la tua parola." : "Scrivi la nota."; return; }
    if (parola && !term) { errore.textContent = "Scrivi il termine tecnico che corrisponde."; return; }
    var quando = adesso();
    var id = "q-" + stampa(quando) + "-" + tre();
    var corpoDoc = { tipo: tipo.value, materia: materia.value.trim(), testo: t, termine_tecnico: parola ? term : null, creata: quando.toISOString() };
    var ok = await Archivio.scrivi("quaderno", id, corpoDoc);
    if (tk !== stato.token) return;
    if (!ok) { errore.textContent = "Non sono riuscito a salvare."; return; }
    voci.push(Object.assign({ id: id }, corpoDoc));
    testo.value = ""; termine.value = "";
    disegna();
  });
  mostra([
    el("h1", { text: "Quaderno" }),
    el("div", { class: "card" }, [
      el("label", { class: "lab", for: "quaderno-tipo" }, ["Cosa scrivi", tipo]),
      el("label", { class: "lab", for: "quaderno-materia" }, ["Materia", materia, materie]),
      etTesto,
      boxTermine,
      errore,
      salva
    ]),
    el("label", { class: "lab", for: "quaderno-filtro" }, ["Filtra", filtro]),
    elenco
  ]);
  sync();
  try {
    voci = await Archivio.leggiTutti("quaderno");
    if (tk !== stato.token) return;
  } catch (e) { voci = []; }
  disegna();
}
VISTE.quaderno = mostraQuaderno;

/* ---------- avvio ---------- */
Array.prototype.forEach.call(document.querySelectorAll("#nav .nav-b"), function (b) {
  b.addEventListener("click", function () { vai(b.getAttribute("data-v")); });
});
mostraHome();
avviaArchivio().then(function () {

});

})();
